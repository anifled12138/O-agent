name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: ${{ github.ref_name || inputs.tag_name }} - O Local-First Agent Platform
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 O Local-First Agent Platform

            欢迎使用 **O** —— 面向本地优先、具备自主工具演化能力的智能工程助手。

            ### 🌟 核心特性 (Key Features)

            - **🧠 Local-First 架构与安全沙箱**：
              - 高性能 Go 后端调度引擎与 Dop251 Goja 虚拟机沙箱隔离
              - 统一模型适配层，支持主流大语言模型提供商
              - 本地 SQLite 持久化会话、状态机与运行审计日志
            - **🧩 原生插件系统与 MCP 协议支持**：
              - 深度整合 Model Context Protocol (MCP) 客户端与工具标准
              - 插件完整自治生命周期：提议、代码生成、沙箱编译与安全权限授权
              - 零编译运行时能力碎片 (Axiom Fragments) 与不可变状态胶囊 (Capsules)
            - **🧬 自主工程演化闭环 (Self-Evolution & Harness)**：
              - 内置多维度能力基准评测集 (Eval Harness)
              - 具备自动化回溯验证、基线性能对比与安全边界约束
            - **🖥️ 现代化前端与桌面客户端**：
              - Next.js / Vite + Tailwind CSS 沉浸式响应式交互界面
              - 内置独立模态框：模型演化观测、MCP/插件中心、会话设置与工作区管理
              - Electron 跨平台桌面端集成与打包支持

            ### 📦 获取源码与使用 (Getting Started)
            - 您可以直接下载下方 Assets 列表中的源码包（`.zip` / `.tar.gz`），或通过 Git 克隆：
              ```bash
              git clone git@github.com:anifled12138/O-agent.git
              ```
