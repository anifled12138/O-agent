name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to test, package, and release
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.source.outputs.tag_name }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source commit
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          commit_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit_sha"
          printf 'tag_name=%s\ncommit_sha=%s\n' "$RELEASE_TAG" "$commit_sha" >> "$GITHUB_OUTPUT"

  build-runtime:
    name: Verify and package tagged runtime
    needs: resolve-source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve-source.outputs.commit_sha }}

  release:
    name: Publish GitHub Release with Windows and Linux runtimes
    needs: [resolve-source, build-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Linux runtime
        uses: actions/download-artifact@v4
        with:
          name: o-agent-cloud-runtime
          path: release-files
      - name: Download verified Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: o-agent-windows-desktop
          path: release-files
      - name: Verify package checksum and source provenance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          cd release-files
          test -f o-agent-cloud-runtime.tar.gz
          test -f o-agent-cloud-runtime.tar.gz.sha256
          sha256sum -c o-agent-cloud-runtime.tar.gz.sha256
          test -f O-Windows-x64-Setup.exe
          test -f O-win32-x64-portable.zip
          sha256sum -c O-Windows-x64-Setup.exe.sha256
          sha256sum -c O-win32-x64-portable.zip.sha256
          grep -Fx "source_commit=$EXPECTED_SOURCE_SHA" WINDOWS-BUILD-INFO
          grep -Fx 'platform=win32' WINDOWS-BUILD-INFO
          grep -Fx 'arch=x64' WINDOWS-BUILD-INFO
          unzip -tq O-win32-x64-portable.zip
          unzip -p O-win32-x64-portable.zip resources/app/runtime/BUILD-INFO | cmp WINDOWS-BUILD-INFO -
          build_info="$(tar -xOf o-agent-cloud-runtime.tar.gz ./BUILD-INFO)"
          test "$build_info" = "source_commit=$EXPECTED_SOURCE_SHA"
          for required in ./backend/axiom ./backend/axiom-sandbox-check ./backend/axiom-quota-helper ./frontend/standalone/server.js ./deploy/ubuntu/install-runtime.sh; do
            tar -tzf o-agent-cloud-runtime.tar.gz | grep -Fx "$required" >/dev/null
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-source.outputs.tag_name }}
          name: ${{ needs.resolve-source.outputs.tag_name }} - O Windows and Linux
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/o-agent-cloud-runtime.tar.gz
            release-files/o-agent-cloud-runtime.tar.gz.sha256
            release-files/O-Windows-x64-Setup.exe
            release-files/O-Windows-x64-Setup.exe.sha256
            release-files/O-win32-x64-portable.zip
            release-files/O-win32-x64-portable.zip.sha256
            release-files/WINDOWS-BUILD-INFO
          body: |
            Windows x64 desktop installer and portable ZIP, plus the Ubuntu x86_64
            cloud runtime. All packages are built and verified from this version tag;
            both platforms must pass before this release can be published.

            Windows: download O-Windows-x64-Setup.exe to install/update, or extract
            the portable ZIP and launch O.exe. Quit the running O app before upgrading.
            This milestone's Windows binaries are unsigned.

            Linux: download the runtime tar.gz and checksum, then follow the included
            deploy/ubuntu/README.md. Verify each download with its .sha256 file.
            Source provenance is included in both packages.
      - name: Read back published runtime assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.tag_name }}
        run: |
          set -Eeuo pipefail
          test "$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName')" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --dir downloaded-release
          (cd downloaded-release && sha256sum -c o-agent-cloud-runtime.tar.gz.sha256 && sha256sum -c O-Windows-x64-Setup.exe.sha256 && sha256sum -c O-win32-x64-portable.zip.sha256)
          for filename in o-agent-cloud-runtime.tar.gz o-agent-cloud-runtime.tar.gz.sha256 O-Windows-x64-Setup.exe O-Windows-x64-Setup.exe.sha256 O-win32-x64-portable.zip O-win32-x64-portable.zip.sha256 WINDOWS-BUILD-INFO; do
            cmp "release-files/$filename" "downloaded-release/$filename"
          done
