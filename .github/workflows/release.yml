name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to test, package, and release
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  resolve-source:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.source.outputs.tag_name }}
      commit_sha: ${{ steps.source.outputs.commit_sha }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source commit
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          commit_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit_sha"
          printf 'tag_name=%s\ncommit_sha=%s\n' "$RELEASE_TAG" "$commit_sha" >> "$GITHUB_OUTPUT"

  build-runtime:
    name: Verify and package tagged runtime
    needs: resolve-source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve-source.outputs.commit_sha }}

  release:
    name: Publish GitHub Release with Linux runtime
    needs: [resolve-source, build-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Linux runtime
        uses: actions/download-artifact@v4
        with:
          name: o-agent-cloud-runtime
          path: release-files
      - name: Verify package checksum and source provenance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          cd release-files
          test -f o-agent-cloud-runtime.tar.gz
          test -f o-agent-cloud-runtime.tar.gz.sha256
          sha256sum -c o-agent-cloud-runtime.tar.gz.sha256
          build_info="$(tar -xOf o-agent-cloud-runtime.tar.gz ./BUILD-INFO)"
          test "$build_info" = "source_commit=$EXPECTED_SOURCE_SHA"
          for required in ./backend/axiom ./backend/axiom-sandbox-check ./backend/axiom-quota-helper ./frontend/standalone/server.js ./deploy/ubuntu/install-runtime.sh; do
            tar -tzf o-agent-cloud-runtime.tar.gz | grep -Fx "$required" >/dev/null
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-source.outputs.tag_name }}
          name: ${{ needs.resolve-source.outputs.tag_name }} - O Linux Cloud Runtime
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/o-agent-cloud-runtime.tar.gz
            release-files/o-agent-cloud-runtime.tar.gz.sha256
          body: |
            This release includes the Ubuntu x86_64 cloud runtime: the O backend,
            Linux sandbox and quota helpers, standalone Web application, and systemd
            deployment files. The package is built from this version tag after CI
            passes, with a SHA-256 checksum and source commit in BUILD-INFO.

            Download both runtime assets, verify the checksum, and follow
            deploy/ubuntu/README.md inside the archive to install and configure
            the server. The automatically generated source archives are source
            code and are not the installable runtime package.
