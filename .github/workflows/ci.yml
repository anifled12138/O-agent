name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, "codex/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Backend Unit & Integration Tests
        run: |
          go test -v -coverprofile=coverage.out ./...

      - name: Build Axiom Binary
        run: |
          CGO_ENABLED=0 go build -v -o bin/axiom ./cmd/axiom

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-backend-binary
          path: backend/bin/axiom

  frontend-test-and-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build

      - name: Build Desktop UI Application
        run: npm run build:desktop-ui

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
